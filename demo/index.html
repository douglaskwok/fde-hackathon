<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memos</title>
<style>
  :root {
    --bg: #f5f5f7;
    --sidebar: rgba(246,246,248,0.9);
    --panel: #ffffff;
    --line: rgba(0,0,0,0.08);
    --text: #1d1d1f;
    --text-2: #6e6e73;
    --text-3: #aeaeb2;
    --blue: #007aff;
    --green: #34c759;
    --yellow: #ffcc00;
    --red: #ff3b30;
    --fill: rgba(120,120,128,0.12);
    --fill-2: rgba(120,120,128,0.2);
    --selected: rgba(0,122,255,0.12);
    --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.06);
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e;
      --sidebar: rgba(28,28,30,0.9);
      --panel: #2c2c2e;
      --line: rgba(255,255,255,0.1);
      --text: #f5f5f7;
      --text-2: #98989d;
      --text-3: #636366;
      --blue: #0a84ff;
      --green: #30d158;
      --yellow: #ffd60a;
      --red: #ff453a;
      --fill: rgba(120,120,128,0.24);
      --fill-2: rgba(120,120,128,0.36);
      --selected: rgba(10,132,255,0.22);
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.4);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Inter, system-ui, sans-serif;
    font-size: 13px;
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 6px; }

  .app {
    display: grid;
    grid-template-columns: 220px 340px 1fr;
    height: 100vh;
    overflow: hidden;
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    background: var(--sidebar);
    border-right: 1px solid var(--line);
    padding: 52px 10px 12px;
    display: flex; flex-direction: column; gap: 2px;
    overflow-y: auto;
  }
  .sidebar h6 {
    margin: 14px 10px 6px; font-size: 11px; font-weight: 600;
    color: var(--text-3); text-transform: uppercase; letter-spacing: 0.04em;
  }
  .nav {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 10px; border-radius: 7px; width: 100%; text-align: left;
    font-size: 13px;
  }
  .nav:hover { background: var(--fill); }
  .nav.active { background: var(--selected); color: var(--blue); font-weight: 500; }
  .nav .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .nav .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav .count { color: var(--text-3); font-size: 12px; font-variant-numeric: tabular-nums; }
  .nav.active .count { color: var(--blue); opacity: 0.7; }
  .nav .glyph { width: 16px; text-align: center; font-size: 13px; color: var(--blue); }
  .nav.active .glyph { color: var(--blue); }
  .nav.add { color: var(--text-2); }
  .nav.add .glyph { color: var(--text-2); }
  .sidebar .spacer { flex: 1; }
  .import {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--blue); color: #fff; font-weight: 500;
    padding: 8px 12px; border-radius: 8px; width: 100%;
  }
  .import:hover { filter: brightness(1.05); }
  .import:active { transform: scale(0.98); }
  .import.secondary { background: var(--fill); color: var(--text); margin-top: 6px; }
  .record-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--red); color: #fff; font-weight: 500;
    padding: 8px 12px; border-radius: 8px; width: 100%;
  }
  .record-btn .rdot { width: 10px; height: 10px; border-radius: 50%; background: #fff; }
  .record-btn:active { transform: scale(0.98); }

  .rec-view { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 70vh; gap: 28px; }
  .rec-view .big-time { font-size: 56px; font-weight: 300; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .rec-view .live { display: flex; align-items: center; gap: 8px; color: var(--red); font-weight: 500; font-size: 13px; }
  .rec-view .live .rdot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1);} 50% { opacity: .35; transform: scale(.8);} }
  .wave { display: flex; align-items: center; gap: 3px; height: 72px; }
  .wave span { width: 3px; background: var(--red); border-radius: 2px; height: 8px; transition: height .12s ease; }
  .stop-btn {
    width: 72px; height: 72px; border-radius: 50%; background: var(--fill-2);
    display: grid; place-items: center;
  }
  .stop-btn::after { content: ""; width: 26px; height: 26px; border-radius: 6px; background: var(--red); }
  .stop-btn:active { transform: scale(0.95); }
  .rec-view .hint { color: var(--text-3); font-size: 12px; }

  /* ---------- List ---------- */
  .list {
    background: var(--bg);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .list-header { padding: 48px 20px 10px; }
  .list-header h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
  .list-header .sub { color: var(--text-2); margin-top: 2px; font-size: 12px; }
  .list-scroll { overflow-y: auto; padding: 0 12px 16px; }
  .group-title {
    position: sticky; top: 0; z-index: 1;
    font-size: 11px; font-weight: 600; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.04em;
    padding: 14px 8px 6px; background: var(--bg);
  }
  .row {
    display: grid; grid-template-columns: 14px 1fr auto; gap: 10px; align-items: start;
    width: 100%; text-align: left;
    padding: 10px 10px; border-radius: 10px;
  }
  .row:hover { background: var(--fill); }
  .row.active { background: var(--selected); }
  .row .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; transition: background .3s; }
  .row .title { font-weight: 500; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .meta { color: var(--text-2); font-size: 12px; margin-top: 2px; display: flex; gap: 6px; align-items: center; }
  .row .meta .cat { color: var(--text-2); }
  .row .meta .sep { color: var(--text-3); }
  .row .meta .pend { color: #b7950b; }
  @media (prefers-color-scheme: dark) { .row .meta .pend { color: var(--yellow); } }
  .row .time { color: var(--text-3); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; margin-top: 1px; }
  .row.processing .title { color: var(--text-2); }
  .empty { color: var(--text-3); text-align: center; padding: 60px 20px; font-size: 13px; }

  .dot.yellow { background: var(--yellow); }
  .dot.green { background: var(--green); }
  .dot.gray { background: var(--text-3); }

  /* ---------- Detail ---------- */
  .detail { overflow-y: auto; padding: 48px 40px 60px; background: var(--bg); }
  .detail-inner { max-width: 640px; margin: 0 auto; }
  .detail .placeholder { color: var(--text-3); text-align: center; margin-top: 35vh; font-size: 15px; }
  .back { display: none; color: var(--blue); font-size: 15px; margin-bottom: 14px; }

  .status-pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 500; padding: 3px 10px 3px 8px; border-radius: 999px;
    background: var(--fill); color: var(--text-2);
    transition: all .3s;
  }
  .status-pill .dot { width: 8px; height: 8px; border-radius: 50%; }
  .status-pill.yellow { background: rgba(255,204,0,0.18); color: #8a6d00; }
  .status-pill.green { background: rgba(52,199,89,0.16); color: #1e7d3a; }
  @media (prefers-color-scheme: dark) {
    .status-pill.yellow { color: var(--yellow); }
    .status-pill.green { color: var(--green); }
  }

  .detail h2 {
    margin: 10px 0 4px; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2;
  }
  .detail .when { color: var(--text-2); font-size: 13px; margin-bottom: 18px; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 20px; }
  .chip {
    font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--fill); color: var(--text);
  }
  .chip.ai { position: relative; }
  .chip.add { color: var(--blue); background: transparent; border: 1px dashed var(--fill-2); }
  .chip.add:hover { background: var(--fill); }
  .select-wrap { position: relative; display: inline-flex; }
  .select-wrap select {
    appearance: none; -webkit-appearance: none;
    font: inherit; font-size: 12px; font-weight: 500;
    padding: 4px 24px 4px 10px; border-radius: 999px; border: 0;
    background: var(--selected); color: var(--blue); cursor: pointer;
  }
  .select-wrap::after {
    content: ""; position: absolute; right: 10px; top: 50%; width: 6px; height: 6px;
    border-right: 1.5px solid var(--blue); border-bottom: 1.5px solid var(--blue);
    transform: translateY(-70%) rotate(45deg); pointer-events: none;
  }

  .card {
    background: var(--panel); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 16px 18px; margin-bottom: 14px;
  }
  .card h4 {
    margin: 0 0 10px; font-size: 11px; font-weight: 600; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.04em; display: flex; justify-content: space-between; align-items: center;
  }
  .card h4 .hint { font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--text-3); }
  .summary { font-size: 14px; line-height: 1.5; margin: 0; color: var(--text); }

  /* player */
  .player { display: flex; align-items: center; gap: 14px; }
  .play {
    width: 40px; height: 40px; border-radius: 50%; background: var(--blue); color: #fff;
    display: grid; place-items: center; flex: none; font-size: 14px;
  }
  .play:active { transform: scale(0.95); }
  .track { flex: 1; }
  .bar {
    position: relative; height: 6px; border-radius: 3px; background: var(--fill-2); cursor: pointer;
  }
  .bar .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--blue); border-radius: 3px; }
  .bar .marker {
    position: absolute; top: -4px; width: 3px; height: 14px; border-radius: 2px;
    background: var(--yellow); transform: translateX(-50%); cursor: pointer;
  }
  .bar .marker:hover { background: var(--text); }
  .times { display: flex; justify-content: space-between; margin-top: 8px; font-size: 11px; color: var(--text-2); font-variant-numeric: tabular-nums; }

  /* key moments */
  .moments { display: flex; flex-direction: column; }
  .moment {
    display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: center;
    padding: 10px 6px; border-radius: 8px; text-align: left; width: 100%;
    border-top: 1px solid var(--line);
  }
  .moment:first-child { border-top: 0; }
  .moment:hover { background: var(--fill); }
  .moment.current .ts { background: var(--blue); color: #fff; }
  .moment .ts {
    font-variant-numeric: tabular-nums; font-size: 12px; font-weight: 600;
    background: var(--selected); color: var(--blue); padding: 3px 0; border-radius: 6px; text-align: center;
  }
  .moment .lbl { font-size: 13px; }

  /* pending items */
  .items { display: flex; flex-direction: column; }
  .item {
    display: flex; align-items: flex-start; gap: 12px; padding: 10px 6px;
    border-top: 1px solid var(--line); width: 100%; text-align: left;
  }
  .item:first-child { border-top: 0; }
  .item .box {
    width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--text-3);
    flex: none; display: grid; place-items: center; transition: all .2s; margin-top: 1px;
  }
  .item .box svg { opacity: 0; transform: scale(0.6); transition: all .2s; }
  .item.done .box { background: var(--green); border-color: var(--green); }
  .item.done .box svg { opacity: 1; transform: scale(1); }
  .item .txt { font-size: 14px; line-height: 1.4; transition: color .2s; }
  .item.done .txt { color: var(--text-3); text-decoration: line-through; }
  .item .kind {
    font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--text-3); margin-top: 3px;
  }
  .resolved-note { color: var(--text-2); font-size: 13px; display: flex; align-items: center; gap: 8px; }
  .resolved-note .dot { width: 8px; height: 8px; border-radius: 50%; }

  .processing-card { display: flex; align-items: center; gap: 12px; color: var(--text-2); }
  .spinner {
    width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--fill-2); border-top-color: var(--blue);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 999px;
    font-size: 13px; font-weight: 500; opacity: 0; pointer-events: none; transition: all .3s;
    box-shadow: var(--shadow);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- Export ---------- */
  .detail-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .export-btn {
    display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500;
    color: var(--blue); padding: 5px 12px; border-radius: 999px; background: var(--selected);
  }
  .export-btn:hover { filter: brightness(0.97); }
  .export-btn:active { transform: scale(0.97); }

  .sheet-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,0.28); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: grid; place-items: center; z-index: 50; animation: fade .18s ease;
  }
  @keyframes fade { from { opacity: 0; } }
  .sheet {
    width: 540px; max-width: calc(100vw - 32px); max-height: calc(100vh - 48px); overflow-y: auto;
    background: var(--panel); border-radius: 16px; box-shadow: 0 24px 80px rgba(0,0,0,0.3);
    padding: 22px 22px 18px; animation: rise .22s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes rise { from { transform: translateY(14px) scale(.98); opacity: 0; } }
  .sheet-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
  .sheet-head h3 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
  .sheet-head .sub { color: var(--text-2); font-size: 13px; margin-top: 3px; }
  .back-sheet { color: var(--blue); font-size: 14px; padding: 2px 4px; }
  .close { width: 26px; height: 26px; border-radius: 50%; background: var(--fill); color: var(--text-2); display: grid; place-items: center; font-size: 13px; }
  .close:hover { background: var(--fill-2); }
  .sheet h5 { margin: 16px 0 8px; font-size: 11px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .04em; }
  .fmt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .fmt {
    display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; text-align: left;
    padding: 12px; border-radius: 12px; background: var(--fill); width: 100%;
  }
  .fmt:hover { background: var(--fill-2); }
  .fmt:active { transform: scale(0.985); }
  .fmt .ic { width: 34px; height: 34px; border-radius: 9px; background: var(--panel); display: grid; place-items: center; font-size: 16px; color: var(--blue); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .fmt .nm { font-weight: 600; font-size: 13px; }
  .fmt .pv { font-size: 12px; color: var(--text-2); margin-top: 2px; line-height: 1.35; }
  .fmt.new { outline: 1.5px solid var(--blue); outline-offset: -1.5px; background: var(--selected); }
  .fmt-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .fmt-chip { font-size: 12px; padding: 5px 11px; border-radius: 999px; background: var(--fill); }
  .fmt-chip:hover { background: var(--fill-2); }

  .chat { margin-top: 6px; }
  .msgs { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
  .msg { max-width: 85%; padding: 8px 12px; border-radius: 14px; font-size: 13px; line-height: 1.4; }
  .msg.me { align-self: flex-end; background: var(--blue); color: #fff; border-bottom-right-radius: 4px; }
  .msg.ai { align-self: flex-start; background: var(--fill); border-bottom-left-radius: 4px; }
  .msg.ai.thinking { color: var(--text-3); }
  .chat-row { display: flex; gap: 8px; }
  .chat-row input {
    flex: 1; font: inherit; font-size: 13px; padding: 9px 14px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); outline: none;
  }
  .chat-row input:focus { border-color: var(--blue); }
  .send { width: 34px; height: 34px; border-radius: 50%; background: var(--blue); color: #fff; display: grid; place-items: center; font-size: 14px; flex: none; }
  .send:disabled { opacity: .4; }

  .done-view { text-align: center; padding: 0 0 4px; }
  .done-view .check { width: 56px; height: 56px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; margin: 0 auto 14px; animation: pop .35s cubic-bezier(.2,.8,.2,1); }
  @keyframes pop { from { transform: scale(.5); opacity: 0; } }
  .done-view h3 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.02em; }
  .done-view .where { color: var(--text-2); font-size: 13px; }
  .preview {
    margin: 16px 0; padding: 14px 16px; border-radius: 12px; background: var(--bg); text-align: left;
    font-size: 12.5px; line-height: 1.5; color: var(--text); border: 1px solid var(--line);
  }
  .preview.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; white-space: pre-wrap; }
  .preview .fn { font-size: 11px; color: var(--text-3); margin-bottom: 8px; display: flex; justify-content: space-between; }
  .preview table { width: 100%; border-collapse: collapse; }
  .preview td, .preview th { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); font-size: 12px; }
  .preview th { color: var(--text-3); font-weight: 600; font-size: 11px; }
  .preview .pr { display: grid; grid-template-rows: repeat(8, 10px); gap: 2px; position: relative; }
  .preview .pr span { display: block; height: 10px; background: var(--blue); border-radius: 2px; }
  .preview .wave span { background: var(--blue); }
  .preview .li { display: flex; gap: 8px; align-items: center; padding: 3px 0; }
  .preview .li i { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--text-3); flex: none; }
  .resolve-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 2px; font-size: 13px; }
  .switch { width: 40px; height: 24px; border-radius: 12px; background: var(--fill-2); position: relative; transition: background .2s; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: left .2s; }
  .switch.on { background: var(--green); }
  .switch.on::after { left: 18px; }
  .primary { display: block; width: 100%; padding: 10px; border-radius: 10px; background: var(--blue); color: #fff; font-weight: 600; font-size: 14px; margin-top: 8px; }
  .primary:active { transform: scale(.985); }

  /* ---------- Responsive ---------- */
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .list { border-right: 0; }
    .detail { display: none; padding: 24px 16px 60px; }
    .app.show-detail .list { display: none; }
    .app.show-detail .detail { display: block; }
    .back { display: inline-flex; }
    .list-header { padding-top: 28px; }
    .mobile-import { display: inline-flex !important; }
    .fmt-grid { grid-template-columns: 1fr; }
    .sheet-bg { align-items: end; }
    .sheet { border-radius: 16px 16px 0 0; max-width: 100vw; }
  }
  .mobile-import { display: none; }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar"></aside>
  <section class="list">
    <div class="list-header">
      <h1 id="listTitle">All Memos</h1>
      <div class="sub" id="listSub"></div>
    </div>
    <div class="list-scroll" id="listScroll"></div>
  </section>
  <section class="detail" id="detail"></section>
</div>
<input type="file" id="fileInput" accept="audio/*" multiple hidden>
<div class="toast" id="toast"></div>

<script>
// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
const STORAGE_KEY = 'memos-demo-v1';

const defaultCategories = [
  { id: 'song',    name: 'Song idea',     color: '#af52de' },
  { id: 'meeting', name: 'Meeting',       color: '#007aff' },
  { id: 'note',    name: 'Note to self',  color: '#ff9500' },
  { id: 'interview', name: 'Interviews',  color: '#5ac8fa' },
];

const daysAgo = (n, h = 10, m = 0) => { const d = new Date(); d.setDate(d.getDate() - n); d.setHours(h, m, 0, 0); return d.toISOString(); };

const seedMemos = [
  {
    id: 'm1', title: '1:1 with Sam — career growth and Q4 goals', category: 'meeting',
    tags: ['Sam', '1:1', 'Q4'], duration: 2712, createdAt: daysAgo(0, 14, 5),

let state = load() || { categories: defaultCategories, memos: seedMemos, filter: 'all', selectedId: 'm1' };

function load() {
  try { const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : null; } catch { return null; }
}
function save() {
  try {
    const copy = { ...state, memos: state.memos.filter(m => !m.processing).map(({ src, ...m }) => m) };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(copy));
  } catch {}
}

// ---------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------
const isPending = m => m.items.some(i => !i.done);
const statusOf = m => m.processing ? 'gray' : isPending(m) ? 'yellow' : 'green';
const cat = id => state.categories.find(c => c.id === id);
const fmt = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60; return h ? `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}` : `${m}:${String(sec).padStart(2,'0')}`; };
function when(iso) {
  const d = new Date(iso), now = new Date();
  const sameDay = (a, b) => a.toDateString() === b.toDateString();
  const y = new Date(now); y.setDate(now.getDate() - 1);
  const time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  if (sameDay(d, now)) return `Today at ${time}`;
  if (sameDay(d, y)) return `Yesterday at ${time}`;
  return d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ` at ${time}`;
}
function shortWhen(iso) {
  const d = new Date(iso), now = new Date();
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  if (d.toDateString() === y.toDateString()) return 'Yesterday';
  return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

// ---------------------------------------------------------------------------
// Player (real <audio> for imported files, simulated for seed memos)
// ---------------------------------------------------------------------------
const player = {
  memoId: null, audio: null, simT: 0, simTimer: null, playing: false,
  bind(memo) {
    if (this.memoId === memo.id) return;
    this.stop();
    this.memoId = memo.id; this.simT = 0;
    if (memo.src) { this.audio = new Audio(memo.src); this.audio.addEventListener('timeupdate', () => renderPlayer()); this.audio.addEventListener('ended', () => { this.playing = false; renderPlayer(); }); }
    else this.audio = null;
  },
  stop() { if (this.audio) { this.audio.pause(); } clearInterval(this.simTimer); this.playing = false; this.audio = null; },
  duration() { const m = state.memos.find(m => m.id === this.memoId); return m ? m.duration : 0; },
  time() { return this.audio ? this.audio.currentTime : this.simT; },
  toggle() {
    if (this.playing) { this.audio ? this.audio.pause() : clearInterval(this.simTimer); this.playing = false; }
    else {
      if (this.audio) this.audio.play();
      else this.simTimer = setInterval(() => { this.simT += 0.25; if (this.simT >= this.duration()) { this.simT = this.duration(); clearInterval(this.simTimer); this.playing = false; } renderPlayer(); }, 250);
      this.playing = true;
    }
    renderPlayer();
  },
  seek(t) { t = Math.max(0, Math.min(t, this.duration())); if (this.audio) this.audio.currentTime = t; else this.simT = t; renderPlayer(); },
};

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------
function render() { renderSidebar(); renderList(); renderDetail(); save(); }

function renderSidebar() {
  const m = state.memos;
  const nav = (key, label, count, glyph, color) => `
    <button class="nav ${state.filter === key ? 'active' : ''}" data-filter="${key}">
      ${color ? `<span class="dot" style="background:${color}"></span>` : `<span class="glyph">${glyph}</span>`}
      <span class="label">${esc(label)}</span><span class="count">${count}</span>
    </button>`;
  document.getElementById('sidebar').innerHTML = `
    ${nav('all', 'All Memos', m.length, '◉')}
    ${nav('pending', 'Pending', m.filter(x => !x.processing && isPending(x)).length, '', 'var(--yellow)')}
    ${nav('resolved', 'Resolved', m.filter(x => !x.processing && !isPending(x)).length, '', 'var(--green)')}
    <h6>Categories</h6>
    ${state.categories.map(c => nav('cat:' + c.id, c.name, m.filter(x => x.category === c.id).length, '', c.color)).join('')}
    <button class="nav add" id="addCat"><span class="glyph">＋</span><span class="label">New Category</span></button>
    <div class="spacer"></div>
    <button class="record-btn" id="recordBtn"><span class="rdot"></span>Record</button>
    <button class="import secondary" id="importBtn">↑&nbsp; Import Memos</button>`;
  document.querySelectorAll('.nav[data-filter]').forEach(b => b.onclick = () => { state.filter = b.dataset.filter; render(); });
  document.getElementById('addCat').onclick = addCategory;
  document.getElementById('importBtn').onclick = () => document.getElementById('fileInput').click();
  document.getElementById('recordBtn').onclick = startRecording;
}

function filteredMemos() {
  const f = state.filter;
  return state.memos.filter(m => f === 'all' ? true : f === 'pending' ? (!m.processing && isPending(m)) : f === 'resolved' ? (!m.processing && !isPending(m)) : m.category === f.slice(4));
}

function renderList() {
  const f = state.filter;
  const title = f === 'all' ? 'All Memos' : f === 'pending' ? 'Pending' : f === 'resolved' ? 'Resolved' : (cat(f.slice(4))?.name || 'Memos');
  document.getElementById('listTitle').textContent = title;
  const list = filteredMemos().slice().sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  const pending = list.filter(m => m.processing || isPending(m));
  const resolved = list.filter(m => !m.processing && !isPending(m));
  document.getElementById('listSub').innerHTML = `${pending.filter(m => !m.processing).length} need attention <button class="mobile-import" id="recordBtn2" style="color:var(--red);margin-left:8px;font-weight:500">● Record</button> <button class="mobile-import" id="importBtn2" style="color:var(--blue);margin-left:8px">Import</button>`;
  const btn2 = document.getElementById('importBtn2'); if (btn2) btn2.onclick = () => document.getElementById('fileInput').click();
  const rbtn2 = document.getElementById('recordBtn2'); if (rbtn2) rbtn2.onclick = startRecording;

  const row = m => {
    const c = cat(m.category); const n = m.items.filter(i => !i.done).length;
    return `<button class="row ${m.id === state.selectedId ? 'active' : ''} ${m.processing ? 'processing' : ''}" data-id="${m.id}">
      <span class="dot ${statusOf(m)}"></span>
      <span>
        <div class="title">${esc(m.title)}</div>
        <div class="meta">
          ${m.processing ? '<span>Processing…</span>' : `<span class="cat">${esc(c?.name || 'Uncategorized')}</span>
          <span class="sep">·</span><span>${fmt(m.duration)}</span>
          ${n ? `<span class="sep">·</span><span class="pend">${n} pending</span>` : ''}`}
        </div>
      </span>
      <span class="time">${shortWhen(m.createdAt)}</span>
    </button>`;
  };
  const scroll = document.getElementById('listScroll');
  scroll.innerHTML = list.length ? `
    ${pending.length ? `<div class="group-title">Needs attention</div>${pending.map(row).join('')}` : ''}
    ${resolved.length ? `<div class="group-title">Resolved</div>${resolved.map(row).join('')}` : ''}`
    : `<div class="empty">No memos here.</div>`;
  scroll.querySelectorAll('.row').forEach(b => b.onclick = () => { state.selectedId = b.dataset.id; document.getElementById('app').classList.add('show-detail'); render(); });
}

function renderDetail() {
  const el = document.getElementById('detail');
  if (recording.active) { renderRecording(el); return; }
  const m = state.memos.find(x => x.id === state.selectedId);
  if (!m) { el.innerHTML = `<div class="placeholder">Select a memo</div>`; return; }
  player.bind(m);
  const st = statusOf(m); const c = cat(m.category);
  const open = m.items.filter(i => !i.done).length;

  if (m.processing) {
    el.innerHTML = `<div class="detail-inner">
      <button class="back" id="back">‹ Memos</button>
      <span class="status-pill"><span class="dot gray"></span>Processing</span>
      <h2>${esc(m.title)}</h2><div class="when">${when(m.createdAt)}</div>
      <div class="card processing-card"><div class="spinner"></div>Listening for a title, summary, key moments, and anything you asked yourself to do…</div>
    </div>`;
    bindBack(); return;
  }

  el.innerHTML = `<div class="detail-inner">
    <button class="back" id="back">‹ Memos</button>
    <div class="detail-top">
      <span class="status-pill ${st}"><span class="dot ${st}"></span>${st === 'yellow' ? `${open} pending` : 'Resolved'}</span>
      <button class="export-btn" id="exportBtn">⇪&nbsp; Export</button>
    </div>
    <h2>${esc(m.title)}</h2>
    <div class="when">${when(m.createdAt)} · ${fmt(m.duration)}</div>

    <div class="chips">
      <span class="select-wrap"><select id="catSelect">
        ${state.categories.map(x => `<option value="${x.id}" ${x.id === m.category ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}
        <option value="__new">New category…</option>
      </select></span>
      ${m.tags.map(t => `<span class="chip">${esc(t)}</span>`).join('')}
      <button class="chip add" id="addTag">＋ Tag</button>
    </div>

    <div class="card">
      <div class="player">
        <button class="play" id="play">${player.playing ? '❚❚' : '▶'}</button>
        <div class="track">
          <div class="bar" id="bar"><div class="fill" id="fill"></div>
            ${m.moments.map((k, i) => `<span class="marker" data-i="${i}" style="left:${(k.t / m.duration) * 100}%" title="${esc(k.label)}"></span>`).join('')}
          </div>
          <div class="times"><span id="cur">0:00</span><span>${fmt(m.duration)}</span></div>
        </div>
      </div>
    </div>

    <div class="card"><h4>Summary</h4><p class="summary">${esc(m.summary)}</p></div>

    ${m.moments.length ? `<div class="card"><h4>Key moments <span class="hint">Tap to jump</span></h4>
      <div class="moments">${m.moments.map((k, i) => `<button class="moment" data-i="${i}"><span class="ts">${fmt(k.t)}</span><span class="lbl">${esc(k.label)}</span></button>`).join('')}</div></div>` : ''}

    <div class="card"><h4>${m.items.length ? 'To deal with' : 'Nothing to deal with'}</h4>
      ${m.items.length ? `<div class="items">${m.items.map(i => `
        <button class="item ${i.done ? 'done' : ''}" data-id="${i.id}">
          <span class="box"><svg width="11" height="9" viewBox="0 0 11 9" fill="none"><path d="M1 4.5L4 7.5L10 1.5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span><div class="txt">${esc(i.text)}</div><div class="kind">${i.kind === 'revisit' ? 'Revisit' : 'Action item'}</div></span>
        </button>`).join('')}</div>`
      : `<div class="resolved-note"><span class="dot green"></span>This memo is just here when you need it.</div>`}
    </div>
  </div>`;

  bindBack();
  document.getElementById('play').onclick = () => player.toggle();
  document.getElementById('bar').onclick = e => { if (e.target.classList.contains('marker')) return; const r = e.currentTarget.getBoundingClientRect(); player.seek(((e.clientX - r.left) / r.width) * m.duration); };
  el.querySelectorAll('.marker, .moment').forEach(b => b.onclick = () => { player.seek(m.moments[+b.dataset.i].t); if (!player.playing) player.toggle(); });
  el.querySelectorAll('.item').forEach(b => b.onclick = () => {
    const it = m.items.find(i => i.id === b.dataset.id); it.done = !it.done;
    const wasPending = open > 0, nowPending = isPending(m);
    render();
    if (wasPending && !nowPending) toast('Resolved · nothing left to deal with');
  });
  document.getElementById('catSelect').onchange = e => {
    if (e.target.value === '__new') { const id = addCategory(); if (id) { m.category = id; } }
    else m.category = e.target.value;
    render();
  };
  document.getElementById('addTag').onclick = () => { const t = prompt('Add a tag'); if (t && t.trim()) { m.tags.push(t.trim()); render(); } };
  document.getElementById('exportBtn').onclick = () => openExport(m);
  renderPlayer();
}

function bindBack() { const b = document.getElementById('back'); if (b) b.onclick = () => { document.getElementById('app').classList.remove('show-detail'); renderList(); }; }

function renderPlayer() {
  const fill = document.getElementById('fill'), cur = document.getElementById('cur'), play = document.getElementById('play');
  if (!fill) return;
  const d = player.duration() || 1, t = player.time();
  fill.style.width = `${Math.min(100, (t / d) * 100)}%`;
  cur.textContent = fmt(t);
  play.textContent = player.playing ? '❚❚' : '▶';
  const m = state.memos.find(x => x.id === player.memoId);
  if (m) document.querySelectorAll('.moment').forEach((el, i) => {
    const next = m.moments[i + 1]; el.classList.toggle('current', t >= m.moments[i].t && (!next || t < next.t));
  });
}

function addCategory() {
  const name = prompt('New category name');
  if (!name || !name.trim()) return null;
  const palette = ['#ff2d55', '#5856d6', '#00c7be', '#ff9f0a', '#64d2ff', '#bf5af2'];
  const c = { id: 'c' + Date.now(), name: name.trim(), color: palette[state.categories.length % palette.length] };
  state.categories.push(c); render(); return c.id;
}

function suggestedFormats(m) {
  const open = m.items.some(i => !i.done);
  const base = {
    meeting:   [open ? 'tasks' : null, 'notes', 'email'],
    song:      ['midi', 'sheet', 'stem', 'lyrics'],
    interview: ['quotes', 'clips', 'insights'],
    note:      [open ? 'reminder' : null, 'text', 'markdown'],
  }[m.category] || ['markdown', 'text', 'audio'];
  const custom = state.customFormats[m.category] || [];
  return [...new Set([...base.filter(Boolean), ...custom])];
}

    <div class="chat">
      <div class="msgs" id="msgs">${exportUI.msgs.map(x => `<div class="msg ${x.who}">${esc(x.text)}</div>`).join('')}</div>
      <form class="chat-row" id="chatForm"><input id="chatIn" placeholder="Describe what you need, e.g. “a table I can paste into Notion”" autocomplete="off"><button class="send" type="submit">↑</button></form>
    </div>
  </div>`;
  document.getElementById('closeSheet').onclick = closeExport;
  exportUI.el.querySelectorAll('[data-fmt]').forEach(b => b.onclick = () => doExport(b.dataset.fmt));
  document.getElementById('chatForm').onsubmit = e => { e.preventDefault(); const v = document.getElementById('chatIn').value.trim(); if (v) askAssistant(v); };
  const msgs = document.getElementById('msgs'); msgs.scrollTop = msgs.scrollHeight;
  if (exportUI.msgs.length) document.getElementById('chatIn').focus();
}

function askAssistant(text) {
  const m = exportUI.memo;
  exportUI.msgs.push({ who: 'me', text });
  renderExportPicker();
  const msgs = document.getElementById('msgs');
  msgs.insertAdjacentHTML('beforeend', '<div class="msg ai thinking">Thinking…</div>');
  const q = text.toLowerCase();
  const pick = (k, reply) => ({ k, reply });
  let r;
  if (/lead sheet|chords|chord chart/.test(q)) r = pick('leadsheet', 'I can lay it out as a lead sheet: key, chords, and the melody on one page.');
  else if (/sheet music|notation|score|staff|notate/.test(q)) r = pick('sheet', 'Sheet music it is. The melody notated on a staff with key signature and tempo.');
  else if (/ableton|logic|daw|garageband|fl studio|midi|piano roll/.test(q)) r = pick('midi', 'MIDI is the one. It drops straight into any DAW with the melody quantized to tempo.');
  else if (/table|spreadsheet|excel|sheets|grid/.test(q) && m.category === 'meeting') r = pick('table', 'How about a table of decisions and owners? It pastes cleanly into Notion or a doc.');
  else if (/csv|spreadsheet|excel|table/.test(q)) r = pick('csv', 'A CSV with one row per key moment, timestamp and label, works for that.');
  else if (/text|message|sms|slack|send|tell/.test(q)) r = pick('message', 'Here is a two-line message you can send as is.');
  else if (/email|mail/.test(q)) r = pick('email', 'A short follow-up email draft, addressed to the people you mentioned.');
  else if (/calendar|schedule|meeting|event|date/.test(q)) r = pick('calendar', 'I can put a follow-up on your calendar with the summary in the notes.');
  else if (/slide|deck|keynote|powerpoint|present/.test(q)) r = pick('slides', 'One slide with the key points, ready to drop into a deck.');
  else if (/pdf|print/.test(q)) r = pick('pdf', 'A one-page PDF summary should do it.');
  else if (/notion|doc|google|markdown|notes/.test(q)) r = pick(m.category === 'meeting' ? 'notes' : 'markdown', 'Markdown is the safest bet. It pastes into Notion, Google Docs, or Obsidian without losing structure.');
  else if (/audio|clip|wav|mp3|sound|recording/.test(q)) r = pick(m.category === 'song' ? 'stem' : 'audio', 'I can give you just the useful part of the recording, trimmed and cleaned up.');
  else if (/remind|todo|task|later/.test(q)) r = pick(m.items.length > 1 ? 'tasks' : 'reminder', 'I will turn what you asked yourself to do into Reminders.');
  else if (/suggest|recommend|don.?t know|dunno|idk|not sure|what would/.test(q)) { const k = suggestedFormats(m)[0]; r = pick(k, `For a ${(cat(m.category)?.name || 'memo').toLowerCase()} like this, I would go with ${FORMATS[k].name}. ${typeof FORMATS[k].pv === 'function' ? FORMATS[k].pv(m) : FORMATS[k].pv}.`); }
  else r = pick('markdown', 'I am not sure of the exact tool, so here is a Markdown version with the summary, key moments, and anything pending. Tell me where it is going and I can shape it better.');
  setTimeout(() => {
    exportUI.msgs.push({ who: 'ai', text: r.reply });
    if (!exportUI.proposed.includes(r.k) && !suggestedFormats(m).includes(r.k)) exportUI.proposed.push(r.k);
    const list = state.customFormats[m.category] = state.customFormats[m.category] || [];
    if (!list.includes(r.k) && !suggestedFormats(m).includes(r.k)) { list.push(r.k); save(); }
    renderExportPicker();
  }, 700 + Math.random() * 500);
}

function slug(t) { return t.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '').slice(0, 40); }

function previewFor(key, m) {
  const f = FORMATS[key]; const fn = f.ext ? `${slug(m.title)}.${f.ext}` : null;
  const head = fn ? `<div class="fn"><span>${esc(fn)}</span><span>${f.ext.toUpperCase()}</span></div>` : '';
  const openItems = m.items.filter(i => !i.done);
  switch (key) {
    case 'tasks': case 'reminder':
      return `<div class="preview">${(openItems.length ? openItems : m.items).map(i => `<div class="li"><i></i>${esc(i.text)}</div>`).join('')}<div style="color:var(--text-3);font-size:11px;margin-top:8px">List: ${esc(cat(m.category)?.name)} · Due tomorrow 9:00 AM</div></div>`;
    case 'midi': {
      let seed = 0; for (const ch of m.id) seed = (seed * 31 + ch.charCodeAt(0)) & 0xffff;
      const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
      const notes = Array.from({ length: 14 }, (_, i) => `<span style="grid-row:${1 + Math.floor(rnd() * 8)}; grid-column:${i * 2 + 1} / span ${1 + Math.floor(rnd() * 2)}"></span>`).join('');
      return `<div class="preview">${head}<div class="pr" style="grid-template-columns:repeat(28,1fr)">${notes}</div><div style="color:var(--text-3);font-size:11px;margin-top:8px">${m.category === 'song' ? 'D minor · 92 BPM' : 'Detected key and tempo'} · ${fmt(m.moments[0]?.t || 0)}–${fmt((m.moments[0]?.t || 0) + 14)} · 14 notes</div></div>`;
    }
    case 'stem': case 'audio': case 'clips': {
      const bars = Array.from({ length: 60 }, (_, i) => `<span style="height:${6 + Math.abs(Math.sin(i * 0.6) * 26 + Math.sin(i * 1.7) * 8)}px"></span>`).join('');
      return `<div class="preview">${head}<div class="wave" style="height:40px;gap:2px">${bars}</div><div style="color:var(--text-3);font-size:11px;margin-top:8px">${key === 'clips' ? `${m.moments.length} clips · ~15s each` : `Trimmed to ${fmt(Math.min(m.duration, 25))} · 44.1 kHz`}</div></div>`;
    }
    case 'lyrics':
      return `<div class="preview mono">${head}${esc(m.moments.map(k => k.label.replace(/[“”]/g, '')).join('\n') || 'la la la, la la')}\n…</div>`;
    case 'quotes': case 'csv': case 'table':
      return `<div class="preview">${head}<table><tr><th>${key === 'table' ? 'Decision' : 'Time'}</th><th>${key === 'table' ? 'Owner' : 'Quote'}</th></tr>${m.moments.map(k => `<tr><td>${key === 'table' ? esc(k.label) : fmt(k.t)}</td><td>${key === 'table' ? esc(m.tags[0] || 'You') : esc(k.label)}</td></tr>`).join('')}</table></div>`;
    case 'email': case 'message': {
      const who = m.tags.find(t => /^[A-Z][a-z]+$/.test(t)) || 'there';
      return `<div class="preview">${key === 'email' ? `<div style="color:var(--text-3);font-size:11px;margin-bottom:6px">To: ${esc(who)} · Subject: Following up on ${esc(m.title)}</div>` : ''}Hi ${esc(who)}, ${key === 'email' ? 'following up on our conversation. ' : ''}${esc(m.summary.split('. ').slice(0, key === 'email' ? 2 : 1).join('. '))}.${openItems.length ? ` I will ${esc(openItems[0].text.charAt(0).toLowerCase() + openItems[0].text.slice(1))}.` : ''}</div>`;
    }
    case 'sheet': {
      let seed = 0; for (const ch of m.id) seed = (seed * 31 + ch.charCodeAt(0)) & 0xffff;
      const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
      const lines = [0,1,2,3,4].map(i => `<line x1="0" y1="${20 + i * 8}" x2="320" y2="${20 + i * 8}" stroke="currentColor" stroke-width="0.8" opacity=".55"/>`).join('');
      const notes = Array.from({ length: 12 }, (_, i) => { const y = 16 + Math.round(rnd() * 9) * 4; const x = 44 + i * 23; const up = y > 36; return `<ellipse cx="${x}" cy="${y}" rx="3.6" ry="2.6" fill="currentColor" transform="rotate(-20 ${x} ${y})"/><line x1="${up ? x + 3.3 : x - 3.3}" y1="${y}" x2="${up ? x + 3.3 : x - 3.3}" y2="${up ? y - 22 : y + 22}" stroke="currentColor" stroke-width="1"/>`; }).join('');
      const bars = [130, 222, 314].map(x => `<line x1="${x}" y1="20" x2="${x}" y2="52" stroke="currentColor" stroke-width="0.8"/>`).join('');
      return `<div class="preview">${head}<div style="font-weight:600;font-size:13px">${esc(m.title)}</div><div style="color:var(--text-2);font-size:11px;margin-bottom:6px">♩ = 92 · D minor · 4/4</div><svg viewBox="0 0 320 70" width="100%" style="color:var(--text);display:block"><text x="4" y="48" font-size="34" font-family="serif">𝄞</text><text x="26" y="30" font-size="11" font-family="serif">♭</text>${lines}${bars}${notes}</svg><div style="color:var(--text-3);font-size:11px;margin-top:6px">Melody from ${fmt(m.moments[0]?.t || 0)} · 1 page</div></div>`;
    }
    case 'leadsheet':
      return `<div class="preview mono">${head}${esc(m.title)}\nKey: D minor   Tempo: 92 BPM   4/4\n\n| Dm      | B♭      | F       | C       |\n| Dm      | B♭      | F       | A7      |\n\n(melody from ${fmt(m.moments[0]?.t || 0)})</div>`;
    case 'calendar':
      return `<div class="preview"><div style="font-weight:600">Follow up: ${esc(m.title)}</div><div style="color:var(--text-2);font-size:12px;margin-top:2px">Tomorrow · 9:00–9:15 AM</div><div style="font-size:12px;margin-top:8px">${esc(m.summary.split('. ')[0])}.</div></div>`;
    case 'slides':
      return `<div class="preview"><div style="aspect-ratio:16/9;background:var(--panel);border-radius:8px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.1)"><div style="font-weight:700;font-size:14px;margin-bottom:8px">${esc(m.title)}</div>${m.moments.slice(0, 3).map(k => `<div style="font-size:11px;color:var(--text-2)">• ${esc(k.label)}</div>`).join('')}</div></div>`;
    case 'pdf':
      return `<div class="preview">${head}<div style="font-weight:600">${esc(m.title)}</div><div style="color:var(--text-2);font-size:12px;margin-top:4px">${esc(m.summary)}</div><div style="color:var(--text-3);font-size:11px;margin-top:8px">1 page</div></div>`;
    default: // notes, insights, markdown, text
      return `<div class="preview mono">${head}# ${esc(m.title)}\n${esc(when(m.createdAt))}\n\n${esc(m.summary)}\n${m.moments.length ? `\n## Key moments\n${m.moments.map(k => `- ${fmt(k.t)} ${esc(k.label)}`).join('\n')}` : ''}${openItems.length ? `\n\n## ${m.category === 'meeting' ? 'Action items' : 'To do'}\n${openItems.map(i => `- [ ] ${esc(i.text)}`).join('\n')}` : ''}</div>`;
  }
}

function doExport(key) {
  const m = exportUI.memo; const f = FORMATS[key];
  let resolve = !!f.resolves && m.items.some(i => !i.done);
  const draw = () => {
    exportUI.el.innerHTML = `<div class="sheet">
      <div class="sheet-head"><button class="back-sheet" id="backSheet">‹ Back</button><button class="close" id="closeSheet2">✕</button></div>
      <div class="done-view">
        <div class="check"><svg width="24" height="20" viewBox="0 0 11 9" fill="none"><path d="M1 4.5L4 7.5L10 1.5" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <h3>${esc(f.name)} ready</h3>
        <div class="where">${esc(f.where)}</div>
        ${previewFor(key, m)}
        ${m.items.some(i => !i.done) ? `<div class="resolve-row"><span>Mark memo as resolved</span><button class="switch ${resolve ? 'on' : ''}" id="resolveSw" aria-label="Mark as resolved"></button></div>` : ''}
        <button class="primary" id="doneBtn">Done</button>
      </div>
    </div>`;
    document.getElementById('backSheet').onclick = renderExportPicker;
    document.getElementById('closeSheet2').onclick = closeExport;
    const sw = document.getElementById('resolveSw'); if (sw) sw.onclick = () => { resolve = !resolve; draw(); };
    document.getElementById('doneBtn').onclick = () => {
      if (resolve) m.items.forEach(i => i.done = true);
      closeExport(); render();
      toast(resolve ? `${f.name} exported · memo resolved` : `${f.name} exported`);
    };
  };
  draw();
}

// ---------------------------------------------------------------------------
// Recording — Wizard of Oz. Nothing is captured; it just looks like it is.
// ---------------------------------------------------------------------------
const recording = { active: false, start: 0, timer: null };

function startRecording() {
  if (recording.active) return;
  player.stop();
  recording.active = true; recording.start = Date.now();
  document.getElementById('app').classList.add('show-detail');
  render();
  recording.timer = setInterval(tickRecording, 120);
}

function renderRecording(el) {
  el.innerHTML = `<div class="detail-inner rec-view">
    <div class="live"><span class="rdot"></span>Recording</div>
    <div class="wave" id="wave">${Array.from({ length: 48 }, () => '<span></span>').join('')}</div>
    <div class="big-time" id="recTime">0:00</div>
    <button class="stop-btn" id="stopBtn" aria-label="Stop"></button>
    <div class="hint">Just talk. Sorting happens after.</div>
  </div>`;
  document.getElementById('stopBtn').onclick = stopRecording;
  tickRecording();
}

function tickRecording() {
  const t = (Date.now() - recording.start) / 1000;
  const timeEl = document.getElementById('recTime'); if (timeEl) timeEl.textContent = fmt(t);
  const bars = document.querySelectorAll('#wave span');
  bars.forEach((b, i) => {
    const env = Math.sin(t * 2.1 + i * 0.35) * 0.5 + 0.5;
    const jitter = Math.random() * 0.6 + 0.2;
    b.style.height = `${6 + env * jitter * 60}px`;
  });
}

const recordedScripts = [
  { title: 'Verse idea over the new chord loop', category: 'song', tags: ['verse', 'loop'],
    summary: 'A half-sung verse melody over the four-chord loop from yesterday. The second line lands nicely; the first still feels rushed.',
    moments: [ { f: 0.25, label: 'The second line, the one that works' }, { f: 0.8, label: 'Trying a slower first line' } ],
    items: [ { kind: 'revisit', text: 'Fix the first line, keep the second' } ] },
  { title: 'After the design sync', category: 'meeting', tags: ['design', 'sync'],
    summary: 'The team agreed to move the settings menu into the sidebar. You promised to write up the decision and send Alex the mockup link.',
    moments: [ { f: 0.3, label: 'Decision: settings goes in the sidebar' }, { f: 0.75, label: 'Alex asks for the mockup link' } ],
    items: [ { kind: 'action', text: 'Write up the settings decision' }, { kind: 'action', text: 'Send Alex the mockup link' } ] },
];
let scriptIndex = 0;

function stopRecording() {
  clearInterval(recording.timer);
  const duration = Math.max(3, Math.round((Date.now() - recording.start) / 1000));
  recording.active = false;
  const script = recordedScripts[scriptIndex++ % recordedScripts.length];
  ingest({ title: 'New Recording', duration, createdAt: new Date().toISOString(), script });
}

// Shared mock enrichment for recorded and imported memos.
function ingest({ title, duration, createdAt, src, script }) {
  const memo = { id: 'u' + Date.now() + Math.random().toString(36).slice(2, 6), title, processing: true, category: 'note', tags: [], duration, createdAt, summary: '', moments: [], items: [], src };
  state.memos.unshift(memo); state.selectedId = memo.id; state.filter = 'all'; render();
  setTimeout(() => {
    if (script) {
      Object.assign(memo, {
        processing: false, title: script.title, category: script.category, tags: script.tags, summary: script.summary,
        moments: script.moments.map(k => ({ t: Math.round(k.f * duration), label: k.label })),
        items: script.items.map((i, n) => ({ id: 'i' + Date.now() + n, ...i, done: false })),
      });
    } else {
      const base = title.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').trim();
      Object.assign(memo, {
        processing: false,
        title: base.match(/^new recording/i) ? 'Untitled thought, worth a listen' : base.charAt(0).toUpperCase() + base.slice(1),
        tags: ['imported'],
        summary: 'This is a draft demo, so the AI layer is simulated. A real build would listen to this recording and write a two-sentence summary here, pick out the moments worth jumping to, and list anything you asked yourself to do.',
        moments: duration > 20 ? [ { t: Math.round(duration * 0.15), label: 'First idea introduced' }, { t: Math.round(duration * 0.62), label: 'The part you’d want to hear again' } ] : [],
        items: duration > 20 ? [ { id: 'i' + Date.now(), kind: 'revisit', text: 'Come back to this one', done: false } ] : [],
      });
    }
    render(); toast('Processed · ' + memo.title);
  }, 1800 + Math.random() * 800);
}

// ---------------------------------------------------------------------------
// Import (mock enrichment, real playback)
// ---------------------------------------------------------------------------
document.getElementById('fileInput').onchange = async e => {
  const files = [...e.target.files]; e.target.value = '';
  for (const f of files) {
    const src = URL.createObjectURL(f);
    const duration = await new Promise(res => { const a = new Audio(src); a.onloadedmetadata = () => res(isFinite(a.duration) ? a.duration : 120); a.onerror = () => res(120); });
    ingest({ title: f.name, duration, createdAt: new Date(f.lastModified || Date.now()).toISOString(), src });
  }
};

render();
</script>
